<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><meta name="referrer" content="no-referrer"><title>LAN Drop · 手机发送</title><link rel="stylesheet" href="/style.css"><script src="/sender.js" defer></script></head><body><div class="page sender-page"><header class="topbar"><a class="brand" href="/send"><span class="brand-mark">↗</span>LAN<span class="brand-light">Drop</span></a><span class="local-badge"><i></i> 仅局域网传输</span></header><main><section class="intro"><div class="eyebrow">PHONE → COMPUTER</div><h1>选好，发送<span class="accent">。</span></h1><p>让文字和图片，轻松抵达电脑。</p></section><div class="sender-status card"><span id="sender-status-dot" class="status-dot"></span><div><strong id="sender-status">正在连接电脑…</strong><p id="sender-status-detail">请保持电脑接收页面开启。</p></div><button id="disconnect" class="text-button hidden">断开</button></div><p id="sender-error" class="message error hidden" role="alert"></p><section class="card send-card"><div class="card-heading"><h2>发送文字</h2><span class="step-label">TEXT / LINK</span></div><form id="text-form"><label class="sr-only" for="text-input">要发送的文字或链接</label><textarea id="text-input" placeholder="粘贴链接，或写点什么…" rows="6" disabled></textarea><div class="send-bottom"><span id="text-count" class="muted">0 字</span><button id="send-text" class="button primary" disabled type="submit">发送文字 <span>↗</span></button></div></form></section><section class="card send-card"><div class="card-heading"><h2>发送图片</h2><span class="step-label">IMAGES / ORIGINAL</span></div><label id="file-picker-label" class="file-picker disabled" for="image-files"><span class="upload-symbol">＋</span><strong>轻点选择图片</strong><span>保留原文件，支持多选</span><input id="image-files" type="file" accept="image/*,.heic,.heif" multiple disabled></label><p id="file-limits" class="field-help">正在获取上传限制…</p><ul id="selected-files" class="selected-files"></ul><div id="upload-progress" class="upload-progress hidden"><div class="progress-track"><div id="progress-bar"></div></div><p id="progress-label" role="status">准备上传…</p></div><div class="send-bottom"><button id="reset-files" type="button" class="text-button hidden">取消选择</button><span id="selection-size" class="muted">尚未选择图片</span><button id="send-images" type="button" class="button primary" disabled>发送图片 <span>↗</span></button></div><p id="upload-message" class="message hidden" role="status"></p></section><div class="sender-footnote"><strong>发送成功，不代表已经保存。</strong><p>请在电脑端下载需要的内容。闲置 <span id="sender-idle">30</span> 分钟后自动清理；HTTP 仅建议在可信 Wi-Fi 下使用。</p><p>上传超时或连接中断时不会自动重发。重试前请先检查电脑接收箱，以免重复。</p></div></main><footer class="footer"><span>LAN Drop / 只在设备之间</span></footer></div><div id="toast" class="toast hidden" role="status"></div></body></html>
